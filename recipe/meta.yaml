{% set name = "jsonlines" %}
{% set version = "4.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 0c6d2c09117550c089995247f605ae4cf77dd1533041d366351f6f298822ea74

build:
  skip: true # [py<38]
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
  run:
    - python
    - attrs >=19.2.0

test:
  imports:
    - jsonlines
    - jsonlines.jsonlines
  source_files:
    - tests
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - pytest -v tests

about:
  home: https://github.com/wbolster/jsonlines
  license_file: LICENSE.rst
  license: BSD-3-Clause
  license_family: BSD
  summary: 'Library with helpers for the jsonlines and ndjson file formats'
  dev_url: https://github.com/wbolster/jsonlines
  doc_url: https://jsonlines.readthedocs.org/

extra:
  recipe-maintainers:
    - pmlandwehr
